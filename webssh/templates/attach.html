<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ title }}</title>
    <link href="/static/img/favicon.png" rel="icon" type="image/png">
    <link href="/static/css/xterm.min.css" rel="stylesheet" type="text/css"/>
    <link href="/static/css/mobile.css?v=20260713" rel="stylesheet" type="text/css"/>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
      }

      #terminal {
        width: 100vw;
        height: 100vh;
      }

      .toolbar {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 20;
        display: flex;
        gap: 8px;
      }

      .toolbar a {
        display: inline-block;
        padding: 6px 10px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 6px;
        font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
      }
    </style>
  </head>
  <body class="attach-page">
    <div id="terminal"></div>
    <div class="toolbar">
      <a href="/sessions">会话管理</a>
    </div>

    <script src="/static/js/xterm.min.js"></script>
    <script src="/static/js/xterm-addon-fit.min.js"></script>
    <script src="/static/js/mobile-terminal.js?v=20260713"></script>
    <script>
      (function () {
        var attach = {% raw attach_json %};
        var config = {
          cursorBlink: true,
          allowTransparency: true,
          drawBoldTextInBrightColors: true,
          macOptionIsMeta: true,
          scrollback: window.MobileTerminalControls.isMobileDevice() ? 300 : 1000,
          windowsMode: true,
          theme: {
            background: '#000000',
            foreground: '#e5e7eb',
            cursor: '#ffffff',
            black: '#000000',
            red: '#cd3131',
            green: '#0dbc79',
            yellow: '#e5e510',
            blue: '#2472c8',
            magenta: '#bc3fbc',
            cyan: '#11a8cd',
            white: '#e5e5e5',
            brightBlack: '#666666',
            brightRed: '#f14c4c',
            brightGreen: '#23d18b',
            brightYellow: '#f5f543',
            brightBlue: '#3b8eea',
            brightMagenta: '#d670d6',
            brightCyan: '#29b8db',
            brightWhite: '#ffffff'
          }
        };
        var term = new window.Terminal(config);
        var fitAddon = new window.FitAddon.FitAddon();
        var mobileControls;
        var decoder;
        var wsBase = window.location.href.split(/\?|#/, 1)[0]
          .replace('/attach', '/ws')
          .replace('http', 'ws');
        var sock = new window.WebSocket(
          wsBase + '?id=' + encodeURIComponent(attach.id)
        );

        try {
          decoder = new window.TextDecoder(attach.encoding || 'utf-8');
        } catch (e) {
          decoder = new window.TextDecoder('utf-8');
        }

        sock.binaryType = 'arraybuffer';
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        term.focus();

        function resize() {
          if (sock.readyState === window.WebSocket.OPEN) {
            fitAddon.fit();
            sock.send(JSON.stringify({'resize': [term.cols, term.rows]}));
          }
        }

        mobileControls = window.MobileTerminalControls.init({
          terminal: term,
          send: function (data) {
            if (sock.readyState === window.WebSocket.OPEN) {
              sock.send(JSON.stringify({'data': data}));
            }
          },
          onResize: resize
        });

        sock.onopen = function () {
          resize();
          window.document.title = attach.title || 'Persistent TTY';
        };

        sock.onmessage = function (event) {
          var text;
          if (event.data instanceof ArrayBuffer) {
            text = decoder.decode(
              new Uint8Array(event.data), {'stream': true}
            );
            term.write(text);
            return;
          }
          if (event.data && event.data.arrayBuffer) {
            event.data.arrayBuffer().then(function (buffer) {
              term.write(decoder.decode(
                new Uint8Array(buffer), {'stream': true}
              ));
            });
          }
        };

        sock.onclose = function (event) {
          term.write(decoder.decode());
          if (mobileControls) {
            mobileControls.destroy();
            mobileControls = null;
          }
          if (event.reason) {
            term.write('\r\n' + event.reason + '\r\n');
          }
        };

        term.onData(function (data) {
          if (sock.readyState === window.WebSocket.OPEN) {
            sock.send(JSON.stringify({'data': data}));
          }
        });

        window.addEventListener('resize', resize);
      }());
    </script>
  </body>
</html>
